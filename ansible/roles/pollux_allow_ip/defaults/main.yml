---
# IP publique de la maison ajoutée automatiquement aux IP autorisées de pollux
# (cf. files/pollux-allow-ip).
pollux_allow_ip_dir: "/home/{{ ansible_user }}/pidesk/pollux"
pollux_allow_ip_interval: 1min
# 1 : pollux-ts redémarre à chaque changement d'IP, garder les anciennes n'apporte
# rien et une IP réattribuée à un autre abonné cesse aussitôt d'être autorisée
pollux_allow_ip_max_auto: 1
