---
- name: Déployer le script de surveillance
  ansible.builtin.copy:
    src: pollux-funnel-watch
    dest: /usr/local/bin/pollux-funnel-watch
    owner: root
    group: root
    mode: '0755'

- name: Déployer le service et le timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - pollux-funnel-watch.service
    - pollux-funnel-watch.timer
  notify: reload systemd

- name: Activer et démarrer le timer
  ansible.builtin.systemd_service:
    name: pollux-funnel-watch.timer
    state: started
    enabled: true
    daemon_reload: true
