services:
  mosquitto:
    container_name: mosquitto
    # Version exacte figée : le format de hachage du `passwd` dépend de la version
    # (PBKDF2 en 2.1+, illisible par 2.0). En changer sans regénérer `passwd` casse
    # l'auth de tous les clients (vigie-capteurs, app Android, ttn-bridge).
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "1883:1883"
    volumes:
      - ./config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    environment:
      TZ: Europe/Paris
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
