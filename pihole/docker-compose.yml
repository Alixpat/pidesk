services:
  pihole:
    container_name: pihole
    # Pinné à 2026.07.2 (Core v6.4.3 / FTL v6.7) le 2026-08-06 après mise à jour + tests (blocking activé, upstream Unbound, TLS désactivé)
    image: pihole/pihole:2026.07.2
    network_mode: host
    environment:
      TZ: 'Europe/Paris'
      WEBPASSWORD: 'changeme'
      FTLCONF_dns_listeningMode: 'all'
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped
