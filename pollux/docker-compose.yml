services:
  # Serveur pollux : transport TCP via requêtes HTTP courtes (passe un proxy qui
  # met en tampon), cible = SSH du Pi. Client web (terminal SSH) sur / réservé aux
  # comptes Google de web.env ; /t (clients en ligne de commande et page) protégé
  # par le jeton. Les deux filtrés par POLLUX_ALLOW_IP.
  # Image construite depuis le dépôt pollux en ~/pollux (cf. README) : serveur Go,
  # artefacts compilés sur le poste (GOARCH=arm64 ./build.sh), pas sur le Pi.
  pollux:
    build: ../../pollux
    image: pollux:local
    container_name: pollux
    network_mode: host
    # --ip-header : Funnel remplace X-Forwarded-For par l'IP réelle du client (un
    # en-tête forgé est écrasé) ; fiable car pollux n'écoute qu'en local.
    command: --host 127.0.0.1 --port 8081 --allow 127.0.0.1:22 --allow udp:127.0.0.1:60001-60004 --ip-header X-Forwarded-For --web web
    env_file:
      - .env       # POLLUX_TOKEN (secret partagé), POLLUX_ALLOW_IP
      - web.env    # POLLUX_OIDC_* (client OAuth, URL publique, e-mails autorisés)
    restart: unless-stopped

  # Nœud Tailscale dédié : Funnel publie pollux sur https://pollux.<tailnet>.ts.net
  # (port 443 ; celui de pidesk sert Vaultwarden au seul tailnet). Userspace :
  # pas de /dev/net/tun ; réseau de l'hôte pour joindre 127.0.0.1:8081.
  pollux-ts:
    image: tailscale/tailscale:v1.102.4
    container_name: pollux-ts
    network_mode: host
    env_file: ts.env   # TS_AUTHKEY (premier démarrage seulement)
    environment:
      TS_HOSTNAME: pollux
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/lib/tailscale/tailscaled.sock   # pas celui du tailscaled de l'hôte
      TS_TAILSCALED_EXTRA_ARGS: --port=41642          # 41641 : tailscaled de l'hôte
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
    depends_on:
      - pollux
