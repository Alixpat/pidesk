services:
  # Serveur pollux : transport TCP via requêtes HTTP courtes (passe un CDN qui
  # met en tampon, contrairement à wstunnel). Écoute en local, cible = SSH du Pi.
  # Image construite depuis le dépôt pollux cloné en ~/pollux (cf. README).
  pollux:
    build: ../../pollux
    container_name: pollux
    network_mode: host
    command: tunnel_server.py --host 127.0.0.1 --port 8081 --allow 127.0.0.1:22
    env_file: .env   # POLLUX_TOKEN (jeton partagé exigé du client)
    restart: unless-stopped

  # Quick Tunnel Cloudflare : gratuit, sans compte. L'URL *.trycloudflare.com
  # change à chaque redémarrage (voir `docker logs pollux-tunnel`).
  pollux-tunnel:
    container_name: pollux-tunnel
    image: cloudflare/cloudflared:latest
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:8081
    restart: unless-stopped
    depends_on:
      - pollux
