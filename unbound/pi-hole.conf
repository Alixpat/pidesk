server:
    # ---- Interface ----
    # Localhost uniquement : seul Pi-hole interroge Unbound (port 53).
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    # FTL (Pi-hole) réutilise ses connexions TCP ~120 s : aligner les
    # timeouts et élargir les slots entrants, sinon warnings
    # "prematurely closed" / "Resource temporarily unavailable".
    edns-tcp-keepalive: yes
    edns-tcp-keepalive-timeout: 120000
    tcp-idle-timeout: 120000
    incoming-num-tcp: 50

    # ---- Contrôle d'accès ----
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    # ---- Sécurité / vie privée ----
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    harden-below-nxdomain: yes
    use-caps-for-id: yes
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    minimal-responses: yes

    # ---- Cache et performance ----
    # Pi 3B : 4 coeurs → 4 threads. Caches volontairement modestes
    # (905 Mo RAM, risque OOM) : préférer les threads aux gros caches.
    num-threads: 4
    msg-cache-size: 8m
    rrset-cache-size: 16m
    key-cache-size: 8m
    # TTL plancher 5 min (ignore les TTL très courts des CDN/pubs).
    cache-min-ttl: 300
    cache-max-ttl: 86400
    # Renouvelle les entrées populaires avant expiration.
    prefetch: yes
    prefetch-key: yes
    # Sert le cache expiré pendant la re-résolution en arrière-plan :
    # tolérance aux coupures de la liaison 4G.
    serve-expired: yes
    serve-expired-ttl: 86400
    # Continue de sonder les serveurs marqués morts : récupération
    # immédiate au retour de la liaison (sinon jusqu'à 15 min de SERVFAIL).
    infra-keep-probing: yes
    # Journalise la cause des SERVFAIL dans les logs systemd.
    log-servfail: yes
    # Requis pour le DoT ci-dessous : sans chemin explicite, la
    # vérification TLS des forwarders échoue ("unable to get local
    # issuer certificate") dans le contexte systemd d'unbound.
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    # ---- Protection DNS rebinding ----
    # Refuse les réponses de domaines publics pointant vers des IP privées.
    private-address: 192.168.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8

# ---- Sortie Internet : forwarding DoT ----
# L'UDP/53 clair est parasité par le réseau mobile (trous noirs
# sélectifs constatés) → tout est forwardé en DNS-over-TLS (TCP/853),
# indiscernable d'HTTPS. Unbound valide toujours DNSSEC localement.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    # Quad9 (associatif, filtre malware)
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    # Cloudflare (secours, diversité d'opérateur)
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
