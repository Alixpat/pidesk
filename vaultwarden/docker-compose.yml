services:
  vaultwarden:
    container_name: vaultwarden
    # Pinné à 1.37.1 le 2026-08-06 après mise à jour et vérification (Rocket lancé, logins OK, SIGNUPS=false)
    image: vaultwarden/server:1.37.1
    ports:
      - "8222:80"
    environment:
      TZ: Europe/Paris
      DOMAIN: https://<TAILSCALE_FQDN>
      SIGNUPS_ALLOWED: "true"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      PASSWORD_HINTS_ALLOWED: "false"
    volumes:
      - ./data:/data
    restart: unless-stopped
