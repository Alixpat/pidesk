services:
  zigbee2mqtt:
    container_name: zigbee2mqtt
    # Version figée : une mise à jour se fait exprès (sauvegarde, tag changé ici, pull, vérification).
    image: koenkk/zigbee2mqtt:2.14.1
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./data:/app/data
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
    network_mode: host
